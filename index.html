<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lock.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Admin Login | Book Collection</title>
  </head>

  <body class="px-6 py-10">
    <h1 class="mb-8 font-bold text-dark-grey text-2xl text-center">
      Admin Login
    </h1>

    <!-- form -->
    <div
      class="flex flex-col items-center bg-white shadow-xl lg:m-auto p-5 border-2 border-gray-200 rounded-lg lg:max-w-105"
    >
      <img
        src="src/assets/images/icons8-safe-96.png"
        class="mb-4 w-15"
        alt="Lock icon"
      />

      <h2 class="mb-1 font-bold text-dark-grey text-xl">Welcome Back</h2>
      <h3 class="mb-8 text-gray-500 text-sm">Log in to your admin panel</h3>

      <form id="login-form">
        <div class="flex flex-col gap-4 mb-2.5">
          <div
            class="flex items-center bg-ice-blue px-4 py-3 border-2 border-gray-200 rounded-md"
          >
            <i class="mr-4 text-gray-500 fa-solid fa-envelope"></i>
            <input
              type="email"
              id="email"
              placeholder="Email"
              autocomplete="email"
              required
              class="bg-transparent outline-none w-full text-dark-grey"
            />
          </div>
          <div
            class="flex items-center bg-ice-blue px-4 py-3 border-2 border-gray-200 rounded-md"
          >
            <i class="mr-4 text-gray-500 fa-solid fa-lock"></i>
            <input
              type="password"
              id="password"
              placeholder="Password"
              autocomplete="current-password"
              class="bg-transparent outline-none w-full text-dark-grey"
              required
            />
            <button
              type="button"
              id="toggle-password"
              class="text-gray-500 text-xl cursor-pointer"
            >
              👁
            </button>
          </div>
        </div>

        <p
          class="mb-6 text-primary-blue hover:text-primary-blue-hover text-sm text-end cursor-pointer"
        >
          Forgot password?
        </p>

        <button
          class="bg-slate-blue hover:bg-slate-blue-hover shadow-xl mb-7 py-3 rounded-md w-full font-bold text-white text-xl tracking-[0.02em] cursor-pointer"
        >
          Log In
        </button>

        <div class="flex justify-center items-center gap-3">
          <p class="text-gray-500 text-sm">Don't have an account?</p>
          <p
            class="font-bold text-primary-blue hover:text-primary-blue-hover text-sm cursor-pointer"
          >
            Sign up
          </p>
        </div>
      </form>
    </div>
  </body>
  <script type="module" src="/src/login.js"></script>
</html>
